<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kloxa — World Time</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
        --white: #ffffff;
        --off-white: #f4f4f4;
        --black: #0a0a0a;
        --grey-1: #1a1a1a;
        --grey-2: #2a2a2a;
        --grey-3: #404040;
        --grey-4: #6b6b6b;
        --grey-5: #9a9a9a;
        --grey-6: #c4c4c4;
        --grey-7: #e0e0e0;
        --red: #e30613;
    }

    html, body {
        height: 100%;
        overflow: hidden;
    }

    body {
        background: var(--white);
        color: var(--black);
        font-family: 'Inter', Helvetica, Arial, sans-serif;
        font-feature-settings: 'ss01', 'cv05', 'cv11', 'tnum';
        -webkit-font-smoothing: antialiased;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
    }

    /* ============================================
       SWISS GRID SHELL
       ============================================ */
    .app {
        width: min(100%, 1240px);
        height: min(100vh - 48px, 800px);
        background: var(--white);
        border: 1px solid var(--black);
        display: grid;
        grid-template-columns: 260px 1fr;
        grid-template-rows: 80px 1fr 56px;
        grid-template-areas:
            "sidebar header"
            "sidebar main"
            "sidebar footer";
        overflow: hidden;
    }

    /* ============================================
       SIDEBAR
       ============================================ */
    .sidebar {
        grid-area: sidebar;
        background: var(--black);
        color: var(--white);
        display: flex;
        flex-direction: column;
        padding: 32px 28px;
        border-right: 1px solid var(--black);
        position: relative;
    }

    .sidebar-brand {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 48px;
    }

    .sidebar-brand .title {
        font-size: 32px;
        font-weight: 700;
        letter-spacing: -0.03em;
        line-height: 1;
        color: var(--white);
    }

    .sidebar-brand .title sup {
        font-size: 12px;
        font-weight: 400;
        vertical-align: super;
        margin-left: 2px;
        color: var(--grey-5);
        letter-spacing: 0;
    }

    /* Section nav — interactive options */
    .sidebar-nav {
        display: flex;
        flex-direction: column;
        gap: 0;
        margin-bottom: auto;
    }

    .nav-item {
        display: flex;
        align-items: baseline;
        gap: 12px;
        padding: 12px 0;
        border-top: 1px solid var(--grey-2);
        font-size: 11px;
        font-weight: 400;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--grey-5);
        cursor: pointer;
        background: transparent;
        border-left: none;
        border-right: none;
        border-bottom: none;
        font-family: inherit;
        text-align: left;
        width: 100%;
        transition: color 0.15s ease, padding-left 0.15s ease;
    }
    .nav-item:last-child { border-bottom: 1px solid var(--grey-2); }
    .nav-item:hover { color: var(--white); padding-left: 4px; }
    .nav-item:focus-visible {
        outline: none;
        color: var(--white);
        box-shadow: inset 2px 0 0 var(--red);
        padding-left: 8px;
    }
    .nav-item.is-active { color: var(--white); }
    .nav-item.is-active .num { color: var(--red); }

    .nav-item .num {
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0;
        min-width: 20px;
    }

    .sidebar-foot {
        display: flex;
        flex-direction: column;
        gap: 14px;
        padding-top: 24px;
    }

    .sidebar-foot .row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--grey-4);
    }
    .sidebar-foot .row span:last-child {
        font-family: 'JetBrains Mono', monospace;
        color: var(--grey-6);
        text-transform: none;
        letter-spacing: 0;
    }

    /* ============================================
       HEADER
       ============================================ */
    .header {
        grid-area: header;
        display: grid;
        grid-template-columns: 1fr auto auto;
        align-items: center;
        gap: 32px;
        padding: 0 40px;
        border-bottom: 1px solid var(--black);
        background: var(--white);
    }

    .header-title {
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--black);
    }
    .header-title span {
        color: var(--grey-4);
        margin-left: 8px;
        font-weight: 400;
        letter-spacing: 0.06em;
        text-transform: none;
    }

    .header-time {
        font-family: 'JetBrains Mono', monospace;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.02em;
        color: var(--black);
        font-variant-numeric: tabular-nums;
    }

    .header-status {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--black);
    }
    .header-status::before {
        content: '';
        display: block;
        width: 6px;
        height: 6px;
        background: var(--red);
        border-radius: 0;
    }

    /* ============================================
       MAIN
       ============================================ */
    .main {
        grid-area: main;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background: var(--white);
    }

    /* --- HERO --- */
    .hero {
        padding: 40px 40px 32px;
        border-bottom: 1px solid var(--black);
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: end;
        gap: 40px;
        flex-shrink: 0;
    }

    .hero-info {
        display: flex;
        flex-direction: column;
        gap: 14px;
        min-width: 0;
    }

    .hero-label {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--grey-4);
    }
    .hero-label .bar {
        display: block;
        width: 20px;
        height: 1px;
        background: var(--red);
    }

    .hero-location {
        font-size: 44px;
        font-weight: 500;
        letter-spacing: -0.035em;
        line-height: 0.95;
        color: var(--black);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .hero-meta {
        display: flex;
        align-items: center;
        gap: 0;
        flex-wrap: wrap;
    }
    .hero-meta-item {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        font-weight: 400;
        color: var(--grey-3);
        padding: 0 16px;
        border-right: 1px solid var(--grey-7);
        letter-spacing: 0.02em;
        font-variant-numeric: tabular-nums;
    }
    .hero-meta-item:first-child { padding-left: 0; }
    .hero-meta-item:last-child { border-right: none; }

    .hero-clock {
        display: flex;
        align-items: baseline;
        gap: 6px;
        text-align: right;
        flex-shrink: 0;
    }

    .hero-time {
        font-family: 'Inter', Helvetica, sans-serif;
        font-size: 108px;
        font-weight: 500;
        letter-spacing: -0.06em;
        line-height: 0.85;
        color: var(--black);
        font-variant-numeric: tabular-nums;
    }

    .hero-ms {
        font-family: 'JetBrains Mono', monospace;
        font-size: 20px;
        font-weight: 400;
        color: var(--grey-5);
        letter-spacing: -0.02em;
        font-variant-numeric: tabular-nums;
        padding-bottom: 8px;
    }

    /* ============================================
       TOOLBAR
       ============================================ */
    .toolbar {
        display: grid;
        grid-template-columns: 1fr auto auto;
        align-items: center;
        gap: 0;
        padding: 0 40px;
        border-bottom: 1px solid var(--black);
        flex-shrink: 0;
        height: 56px;
    }

    .search-wrap {
        display: flex;
        align-items: center;
        gap: 12px;
        height: 100%;
        border-right: 1px solid var(--grey-7);
        padding-right: 24px;
    }

    .search-wrap svg {
        width: 14px;
        height: 14px;
        color: var(--grey-4);
        flex-shrink: 0;
    }

    .search-wrap input {
        width: 100%;
        height: 100%;
        border: none;
        background: transparent;
        font-family: inherit;
        font-size: 12px;
        font-weight: 400;
        color: var(--black);
        outline: none;
        letter-spacing: 0.01em;
    }
    .search-wrap input::placeholder {
        color: var(--grey-5);
        text-transform: uppercase;
        letter-spacing: 0.12em;
        font-size: 10px;
        font-weight: 500;
    }

    .toolbar-btn {
        height: 56px;
        padding: 0 24px;
        border: none;
        background: transparent;
        font-family: inherit;
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--grey-3);
        cursor: pointer;
        border-right: 1px solid var(--grey-7);
        transition: color 0.15s ease, background 0.15s ease;
    }
    .toolbar-btn:last-child { border-right: none; }
    .toolbar-btn:hover { color: var(--black); background: var(--off-white); }
    .toolbar-btn:focus-visible {
        outline: 2px solid var(--red);
        outline-offset: -4px;
    }
    .toolbar-btn .dot {
        display: inline-block;
        width: 5px;
        height: 5px;
        background: var(--red);
        margin-right: 8px;
        vertical-align: middle;
        margin-top: -2px;
    }

    /* ============================================
       REGION LIST
       ============================================ */
    .regions {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        overflow-x: hidden;
        padding: 0;
        scrollbar-width: thin;
        scrollbar-color: var(--grey-6) transparent;
    }
    .regions::-webkit-scrollbar { width: 8px; }
    .regions::-webkit-scrollbar-track { background: var(--white); }
    .regions::-webkit-scrollbar-thumb {
        background: var(--grey-6);
        border: 2px solid var(--white);
    }
    .regions::-webkit-scrollbar-thumb:hover { background: var(--grey-4); }

    .grid-head {
        display: grid;
        grid-template-columns: 1.5fr 1fr 1fr 1fr;
        padding: 12px 40px;
        background: var(--black);
        color: var(--white);
        font-size: 9px;
        font-weight: 500;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        position: sticky;
        top: 0;
        z-index: 2;
    }

    .grid-row {
        display: grid;
        grid-template-columns: 1.5fr 1fr 1fr 1fr;
        align-items: center;
        padding: 18px 40px;
        border-bottom: 1px solid var(--grey-7);
        cursor: pointer;
        background: var(--white);
        transition: background 0.1s ease;
        position: relative;
    }
    .grid-row:hover { background: var(--off-white); }
    .grid-row:focus-visible {
        outline: none;
        background: var(--off-white);
        box-shadow: inset 4px 0 0 var(--red);
    }
    .grid-row.is-active {
        background: var(--black);
        color: var(--white);
    }
    .grid-row.is-active .col-name,
    .grid-row.is-active .col-tz,
    .grid-row.is-active .col-time,
    .grid-row.is-active .col-offset { color: var(--white); }
    .grid-row.is-active .col-name::before {
        content: '';
        display: inline-block;
        width: 6px;
        height: 6px;
        background: var(--red);
        margin-right: 10px;
        vertical-align: middle;
        margin-top: -2px;
    }

    .col-name {
        font-size: 13px;
        font-weight: 500;
        color: var(--black);
        letter-spacing: -0.005em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        padding-right: 20px;
    }

    .col-tz {
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px;
        font-weight: 400;
        color: var(--grey-4);
        letter-spacing: 0.02em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        padding-right: 20px;
        text-transform: uppercase;
    }

    .col-time {
        font-family: 'JetBrains Mono', monospace;
        font-size: 15px;
        font-weight: 500;
        color: var(--black);
        letter-spacing: -0.02em;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
        padding-right: 20px;
    }

    .col-offset {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        font-weight: 400;
        color: var(--grey-4);
        letter-spacing: 0.02em;
        font-variant-numeric: tabular-nums;
        text-align: right;
        white-space: nowrap;
    }

    .empty-state {
        padding: 64px 40px;
        text-align: center;
        font-size: 12px;
        font-weight: 400;
        letter-spacing: 0.06em;
        color: var(--grey-4);
        text-transform: uppercase;
    }

    /* ============================================
       FOOTER
       ============================================ */
    .footer {
        grid-area: footer;
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        padding: 0 40px;
        border-top: 1px solid var(--black);
        background: var(--white);
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--grey-4);
    }
    .footer-right {
        display: flex;
        align-items: center;
        gap: 24px;
    }
    .footer-right .sep {
        width: 1px;
        height: 12px;
        background: var(--grey-6);
    }

    /* ============================================
       RESPONSIVE
       ============================================ */
    @media (max-width: 1024px) {
        .app {
            grid-template-columns: 200px 1fr;
            grid-template-rows: 72px 1fr 48px;
        }
        .sidebar { padding: 24px 20px; }
        .sidebar-brand .title { font-size: 26px; }
        .header { padding: 0 24px; gap: 20px; }
        .hero { padding: 32px 24px 24px; }
        .hero-time { font-size: 84px; }
        .hero-location { font-size: 34px; }
        .toolbar { padding: 0 24px; height: 48px; }
        .toolbar-btn { height: 48px; padding: 0 18px; }
        .grid-head, .grid-row { padding-left: 24px; padding-right: 24px; }
        .grid-head, .grid-row { grid-template-columns: 1.4fr 1fr 1fr 1fr; }
        .footer { padding: 0 24px; }
    }

    @media (max-width: 720px) {
        body { padding: 0; }
        .app {
            width: 100%;
            height: 100vh;
            max-height: none;
            border: none;
            grid-template-columns: 1fr;
            grid-template-rows: 64px auto 1fr 48px;
            grid-template-areas:
                "header"
                "hero"
                "main"
                "footer";
        }
        .sidebar { display: none; }
        .header { padding: 0 20px; gap: 16px; grid-template-columns: 1fr auto; }
        .header-time { display: none; }
        .main { display: contents; }
        .hero {
            grid-area: hero;
            padding: 24px 20px;
            grid-template-columns: 1fr;
            gap: 20px;
            border-bottom: 1px solid var(--black);
        }
        .hero-clock { text-align: left; }
        .hero-time { font-size: 64px; }
        .hero-location { font-size: 24px; }
        .toolbar { padding: 0 20px; grid-template-columns: 1fr auto; height: 48px; }
        .search-wrap { padding-right: 16px; }
        .toolbar-btn { height: 48px; padding: 0 16px; font-size: 9px; }
        .regions { grid-area: main; }
        .grid-head { display: none; }
        .grid-row {
            grid-template-columns: 1fr auto;
            grid-template-rows: auto auto;
            padding: 14px 20px;
            gap: 4px 12px;
        }
        .col-name { grid-column: 1; font-size: 12px; padding: 0; }
        .col-tz { grid-column: 1; grid-row: 2; font-size: 9px; padding: 0; }
        .col-time {
            grid-column: 2; grid-row: 1 / 3;
            font-size: 16px;
            padding: 0;
            text-align: right;
            align-self: center;
        }
        .col-offset { display: none; }
        .footer { padding: 0 20px; grid-template-columns: 1fr; }
        .footer-right { display: none; }
    }
</style>
</head>
<body>

<div class="app">

    <!-- ===== SIDEBAR ===== -->
    <aside class="sidebar">
        <div class="sidebar-brand">
            <span class="title">Kloxa<sup>®</sup></span>
        </div>

        <nav class="sidebar-nav" id="sidebarNav">
            <button class="nav-item is-active" data-view="all" type="button">
                <span class="num">01</span> World Time
            </button>
            <button class="nav-item" data-view="major" type="button">
                <span class="num">02</span> Timezones
            </button>
            <button class="nav-item" data-view="reference" type="button">
                <span class="num">03</span> Reference
            </button>
        </nav>

        <div class="sidebar-foot">
            <div class="row"><span>Timezones</span><span id="sideTzCount">27</span></div>
            <div class="row"><span>Refresh</span><span>250 ms</span></div>
            <div class="row"><span>Version</span><span>1.0.0</span></div>
        </div>
    </aside>

    <!-- ===== HEADER ===== -->
    <header class="header">
        <div class="header-title">
            <span id="headerViewTitle">World Clock</span><span id="headerRegion">/ Local</span>
        </div>
        <div class="header-time" id="headerTime">--:--:--</div>
        <div class="header-status">Live</div>
    </header>

    <!-- ===== MAIN ===== -->
    <main class="main">

        <!-- HERO -->
        <section class="hero">
            <div class="hero-info">
                <div class="hero-label">
                    <span class="bar"></span>
                    <span id="heroLabel">Detecting location</span>
                </div>
                <div class="hero-location" id="heroLocation">—</div>
                <div class="hero-meta">
                    <span class="hero-meta-item" id="heroOffset">GMT+00:00</span>
                    <span class="hero-meta-item" id="heroDate">—</span>
                    <span class="hero-meta-item" id="heroTz">UTC</span>
                </div>
            </div>

            <div class="hero-clock">
                <span class="hero-time" id="heroTime">--:--:--</span>
                <span class="hero-ms" id="heroMs">.00</span>
            </div>
        </section>

        <!-- TOOLBAR -->
        <div class="toolbar">
            <label class="search-wrap">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square">
                    <circle cx="11" cy="11" r="7"/>
                    <path d="M21 21l-4.35-4.35"/>
                </svg>
                <input type="text" id="searchInput" placeholder="Search timezone" autocomplete="off" spellcheck="false" />
            </label>
            <button class="toolbar-btn" id="btnHome" type="button">
                <span class="dot"></span>My Location
            </button>
        </div>

        <!-- REGION GRID -->
        <div class="regions" id="regionsScroll">
            <div class="grid-head" id="gridHead">
                <div>Location</div>
                <div>Timezone</div>
                <div>Local Time</div>
                <div style="text-align:right;">Offset</div>
            </div>
            <div id="regionsBody"></div>
        </div>

    </main>

    <!-- ===== FOOTER ===== -->
    <footer class="footer">
        <div></div>
        <div class="footer-right">
            <span id="footerCount">27 Zones</span>
            <span class="sep"></span>
            <span>© 2024</span>
        </div>
    </footer>

</div>

<script>
(function () {
    "use strict";

    /* ---------- DATA ---------- */
    const REGIONS = [
        { name: "Hawaii",       tz: "Pacific/Honolulu",              group: "major" },
        { name: "Anchorage",    tz: "America/Anchorage",             group: "major" },
        { name: "Los Angeles",  tz: "America/Los_Angeles",           group: "major" },
        { name: "Denver",       tz: "America/Denver",                group: "major" },
        { name: "Chicago",      tz: "America/Chicago",               group: "major" },
        { name: "New York",     tz: "America/New_York",              group: "major" },
        { name: "Halifax",      tz: "America/Halifax",               group: "major" },
        { name: "São Paulo",    tz: "America/Sao_Paulo",             group: "reference" },
        { name: "Buenos Aires", tz: "America/Argentina/Buenos_Aires", group: "reference" },
        { name: "Reykjavík",    tz: "Atlantic/Reykjavik",            group: "reference" },
        { name: "London",       tz: "Europe/London",                 group: "major" },
        { name: "Berlin",       tz: "Europe/Berlin",                 group: "major" },
        { name: "Athens",       tz: "Europe/Athens",                 group: "reference" },
        { name: "Johannesburg", tz: "Africa/Johannesburg",           group: "reference" },
        { name: "Moscow",       tz: "Europe/Moscow",                 group: "reference" },
        { name: "Dubai",        tz: "Asia/Dubai",                    group: "reference" },
        { name: "Mumbai",       tz: "Asia/Kolkata",                  group: "major" },
        { name: "Dhaka",        tz: "Asia/Dhaka",                    group: "reference" },
        { name: "Bangkok",      tz: "Asia/Bangkok",                  group: "reference" },
        { name: "Shanghai",     tz: "Asia/Shanghai",                 group: "major" },
        { name: "Tokyo",        tz: "Asia/Tokyo",                    group: "major" },
        { name: "Seoul",        tz: "Asia/Seoul",                    group: "reference" },
        { name: "Perth",        tz: "Australia/Perth",               group: "reference" },
        { name: "Adelaide",     tz: "Australia/Adelaide",            group: "reference" },
        { name: "Sydney",       tz: "Australia/Sydney",              group: "major" },
        { name: "Auckland",     tz: "Pacific/Auckland",              group: "major" },
        { name: "Apia",         tz: "Pacific/Apia",                  group: "reference" }
    ];

    /* ---------- STATE ---------- */
    let userTz = "UTC";
    let selectedTz = null;
    let filter = "";
    let currentView = "all";   // "all" | "major" | "reference"

    /* ---------- DOM ---------- */
    const $ = (id) => document.getElementById(id);
    const els = {
        headerTime:      $("headerTime"),
        headerRegion:    $("headerRegion"),
        headerViewTitle: $("headerViewTitle"),
        heroLabel:       $("heroLabel"),
        heroLocation:    $("heroLocation"),
        heroOffset:      $("heroOffset"),
        heroDate:        $("heroDate"),
        heroTz:          $("heroTz"),
        heroTime:        $("heroTime"),
        heroMs:          $("heroMs"),
        searchInput:     $("searchInput"),
        btnHome:         $("btnHome"),
        regionsBody:     $("regionsBody"),
        regionsScroll:   $("regionsScroll"),
        gridHead:        $("gridHead"),
        footerCount:     $("footerCount"),
        sideTzCount:     $("sideTzCount"),
        sidebarNav:      $("sidebarNav")
    };

    /* ---------- HELPERS ---------- */
    function getTimeInfo(tz) {
        const now = new Date();
        const fmt = new Intl.DateTimeFormat("en-GB", {
            timeZone: tz,
            hour: "2-digit", minute: "2-digit", second: "2-digit",
            hour12: false,
            timeZoneName: "shortOffset"
        });
        const parts = fmt.formatToParts(now);
        let hour = "00", minute = "00", second = "00", offset = "+00:00";

        for (const p of parts) {
            if (p.type === "hour") hour = p.value;
            else if (p.type === "minute") minute = p.value;
            else if (p.type === "second") second = p.value;
            else if (p.type === "timeZoneName") {
                const m = p.value.match(/([+-])(\d{1,2})(?::(\d{2}))?/);
                if (m) {
                    offset = m[1] + m[2].padStart(2, "0") + ":" + (m[3] || "00");
                }
            }
        }
        return { hour, minute, second, offset };
    }

    function getDateString(tz) {
        try {
            return new Intl.DateTimeFormat("en-GB", {
                timeZone: tz,
                weekday: "short", day: "2-digit", month: "short", year: "numeric"
            }).format(new Date()).toUpperCase();
        } catch (e) { return ""; }
    }

    function getLocalTz() {
        try { return Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC"; }
        catch (e) { return "UTC"; }
    }

    function findRegionName(tz) {
        const found = REGIONS.find(r => r.tz === tz);
        if (found) return found.name;
        const parts = tz.split("/");
        return parts[parts.length - 1].replace(/_/g, " ");
    }

    function esc(s) {
        return String(s).replace(/[&<>"']/g, c => ({
            "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
        }[c]));
    }

    function getViewTitle() {
        if (currentView === "major") return "Timezones";
        if (currentView === "reference") return "Reference";
        return "World Clock";
    }

    /* ---------- RENDER: HERO ---------- */
    function renderHero() {
        const now = new Date();
        const tz = selectedTz || userTz;
        const info = getTimeInfo(tz);

        els.heroTime.textContent = info.hour + ":" + info.minute + ":" + info.second;
        els.heroMs.textContent = "." + String(Math.floor(now.getMilliseconds() / 10)).padStart(2, "0");

        els.heroOffset.textContent = "GMT" + info.offset;
        els.heroDate.textContent = getDateString(tz);
        els.heroTz.textContent = tz.split("/").pop().replace(/_/g, " ");

        if (selectedTz) {
            els.heroLabel.textContent = "Selected Timezone";
            els.heroLocation.textContent = findRegionName(selectedTz);
            els.headerRegion.textContent = "/ " + findRegionName(selectedTz);
        } else {
            els.heroLabel.textContent = "Your Location";
            els.heroLocation.textContent = findRegionName(userTz);
            els.headerRegion.textContent = "/ Local";
        }

        els.headerViewTitle.textContent = getViewTitle();

        const localInfo = getTimeInfo(userTz);
        els.headerTime.textContent = localInfo.hour + ":" + localInfo.minute + ":" + localInfo.second;
    }

    /* ---------- RENDER: REGIONS ---------- */
    function renderRegions() {
        const q = filter.trim().toLowerCase();

        let visible = REGIONS;
        if (currentView === "major") visible = visible.filter(r => r.group === "major");
        if (currentView === "reference") visible = visible.filter(r => r.group === "reference");

        if (q) {
            visible = visible.filter(r =>
                r.name.toLowerCase().includes(q) || r.tz.toLowerCase().includes(q));
        }

        els.footerCount.textContent = visible.length + " Zones";
        els.sideTzCount.textContent = visible.length;

        if (visible.length === 0) {
            els.regionsBody.innerHTML =
                '<div class="empty-state">No matching timezones</div>';
            return;
        }

        const frag = document.createDocumentFragment();
        for (const r of visible) {
            const info = getTimeInfo(r.tz);
            const tzShort = r.tz.split("/").pop().replace(/_/g, " ").toUpperCase();
            const active = (r.tz === selectedTz) ? " is-active" : "";

            const row = document.createElement("div");
            row.className = "grid-row" + active;
            row.setAttribute("role", "button");
            row.setAttribute("tabindex", "0");
            row.dataset.tz = r.tz;
            row.dataset.name = r.name;
            row.innerHTML =
                '<div class="col-name">' + esc(r.name) + '</div>' +
                '<div class="col-tz">' + esc(tzShort) + '</div>' +
                '<div class="col-time">' + info.hour + ":" + info.minute + ":" + info.second + '</div>' +
                '<div class="col-offset">' + info.offset + '</div>';
            frag.appendChild(row);
        }
        els.regionsBody.replaceChildren(frag);
    }

    /* ---------- TICK ---------- */
    function tick() {
        renderHero();
        const rows = els.regionsBody.querySelectorAll(".grid-row");
        for (const row of rows) {
            const tz = row.dataset.tz;
            if (!tz) continue;
            const info = getTimeInfo(tz);
            const t = row.querySelector(".col-time");
            const o = row.querySelector(".col-offset");
            if (t) t.textContent = info.hour + ":" + info.minute + ":" + info.second;
            if (o) o.textContent = info.offset;
        }
    }

    /* ---------- ACTIONS ---------- */
    function selectRegion(tz, name) {
        selectedTz = tz;
        renderHero();
        const rows = els.regionsBody.querySelectorAll(".grid-row");
        for (const row of rows) {
            row.classList.toggle("is-active", row.dataset.tz === tz);
        }
    }

    function goHome() {
        userTz = getLocalTz();
        selectedTz = null;
        renderHero();
        const rows = els.regionsBody.querySelectorAll(".grid-row");
        for (const row of rows) row.classList.remove("is-active");
    }

    function setView(view) {
        currentView = view;
        const buttons = els.sidebarNav.querySelectorAll(".nav-item");
        for (const btn of buttons) {
            btn.classList.toggle("is-active", btn.dataset.view === view);
        }
        renderRegions();
        renderHero();
    }

    /* ---------- INIT ---------- */
    function init() {
        userTz = getLocalTz();
        selectedTz = null;
        currentView = "all";

        renderRegions();
        renderHero();

        // Nav options
        els.sidebarNav.addEventListener("click", (e) => {
            const btn = e.target.closest(".nav-item");
            if (!btn) return;
            setView(btn.dataset.view);
        });

        // Search
        let t = null;
        els.searchInput.addEventListener("input", (e) => {
            filter = e.target.value;
            clearTimeout(t);
            t = setTimeout(renderRegions, 90);
        });

        // Click on row
        els.regionsBody.addEventListener("click", (e) => {
            const row = e.target.closest(".grid-row");
            if (!row) return;
            selectRegion(row.dataset.tz, row.dataset.name);
        });

        // Keyboard on row
        els.regionsBody.addEventListener("keydown", (e) => {
            if (e.key !== "Enter" && e.key !== " ") return;
            const row = e.target.closest(".grid-row");
            if (!row) return;
            e.preventDefault();
            selectRegion(row.dataset.tz, row.dataset.name);
        });

        els.btnHome.addEventListener("click", goHome);

        tick();
        setInterval(tick, 250);

        // Re-detect location on focus
        window.addEventListener("focus", () => {
            const newTz = getLocalTz();
            if (newTz !== userTz) {
                userTz = newTz;
                if (!selectedTz) renderHero();
            }
        });
    }

    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", init);
    } else {
        init();
    }
})();
</script>

</body>
</html>
